<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Vegetables List</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #f8f9fa;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .form-group {
            margin-bottom: 20px;
        }
        input[type="number"] {
            padding: 8px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
        }
        .error {
            color: red;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .stats {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <i class="fas fa-carrot" style="font-size: 3em; color: #764ba2;"></i>
            <h1>Овощи для салата <span th:text="${message}"></span></h1>
        </div>

        <div th:if="${error}" class="error" th:text="${error}"></div>

        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Calories</th>
                <th>Actions</th>
            </tr>
            <tr th:each="veg : ${veggies}">
                <td th:text="${veg.id}"></td>
                <td th:text="${veg.name}"></td>
                <td th:text="${veg.calories}"></td>
                <td>
                    <a th:href="@{/veggies/edit/{id}(id=${veg.id})}" class="btn btn-primary"><i class="fas fa-edit"></i> Edit</a>
                    <a th:href="@{/veggies/delete/{id}(id=${veg.id})}" class="btn btn-danger"><i class="fas fa-trash"></i> Delete</a>
                </td>
            </tr>
        </table>

        <div class="stats">
            <p>Общая калорийность салата: <span th:text="${totalCalories}"></span></p>
        </div>

        <a th:href="@{/veggies/sorted}" class="btn btn-primary"><i class="fas fa-sort"></i> Сортировать по калорийности</a>
        <a th:href="@{/veggies}" class="btn btn-primary"><i class="fas fa-undo"></i> Сброс</a>

        <form th:action="@{/veggies/range}" method="get" class="form-group">
            <label>Min calories:</label>
            <input type="number" name="min" min="0" required>
            <label>Max calories:</label>
            <input type="number" name="max" min="0" required>
            <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i> Поиск по диапазону</button>
        </form>

        <a th:href="@{/veggies/add}" class="btn btn-primary"><i class="fas fa-plus"></i> Добавить овощ</a>
    </div>
</div>
</body>
</html>
