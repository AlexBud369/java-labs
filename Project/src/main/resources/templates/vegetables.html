<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Список овощей</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <div class="card">
        <a href="/" style="display: inline-block; margin-bottom: 20px; padding: 8px 15px; background: #f8f8f8; border-radius: 4px;">← На главную</a>

        <div class="header">
            <h1>Овощи для салата</h1>
            <p th:text="${message}"></p>
        </div>

        <div th:if="${error}" class="error" th:text="${error}"></div>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Калории</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="veg : ${veggies}">
                <td th:text="${veg.id}"></td>
                <td th:text="${veg.name}"></td>
                <td th:text="${veg.calories}"></td>
                <td>
                    <a th:href="@{/veggies/edit/{id}(id=${veg.id})}" class="btn">Изменить</a>
                    <a th:href="@{/veggies/delete/{id}(id=${veg.id})}" class="btn btn-danger">Удалить</a>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="stats">
            <p>Общая калорийность салата: <strong th:text="${totalCalories}"></strong></p>
        </div>

        <div style="margin: 30px 0; padding: 25px; background: #f8f8f8; border-radius: 4px;">
            <h2>Сортировка и фильтрация</h2>

            <div style="margin: 20px 0;">
                <a th:href="@{/veggies/sorted}" class="btn" style="margin-right: 10px;">Сортировать по калорийности</a>
                <a th:href="@{/veggies}" class="btn">Сбросить фильтры</a>
            </div>

            <div style="margin-top: 25px;">
                <h3>Поиск по диапазону калорий</h3>
                <form th:action="@{/veggies/range}" method="get" style="margin-top: 15px;">
                    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end;">
                        <div style="flex: 1; min-width: 200px;">
                            <label>Минимальные калории:</label>
                            <input type="number" name="min" min="0" required style="margin-top: 5px;">
                        </div>
                        <div style="flex: 1; min-width: 200px;">
                            <label>Максимальные калории:</label>
                            <input type="number" name="max" min="0" required style="margin-top: 5px;">
                        </div>
                        <div>
                            <button type="submit" class="btn">Поиск</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a th:href="@{/veggies/add}" class="btn btn-primary">Добавить новый овощ</a>
        </div>
    </div>
</div>
</body>
</html>
