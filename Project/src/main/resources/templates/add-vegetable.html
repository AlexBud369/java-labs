<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Добавить овощ</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <div class="card">
        <a href="/" style="display: inline-block; margin-bottom: 20px; padding: 8px 15px; background: #f8f8f8; border-radius: 4px;">← На главную</a>

        <div class="header">
            <h1>Добавить новый овощ</h1>
        </div>

        <div th:if="${error}" class="error" th:text="${error}"></div>

        <form th:action="@{/veggies/add}" th:object="${vegetable}" method="post">
            <div class="form-group">
                <label for="name">Название *</label>
                <input type="text" id="name" th:field="*{name}" required placeholder="Например: Морковь">
            </div>

            <div class="form-group">
                <label for="calories">Калории *</label>
                <input type="number" id="calories" th:field="*{calories}" min="0" required placeholder="0">
            </div>

            <div style="display: flex; gap: 15px; margin-top: 30px;">
                <button type="submit" class="btn btn-primary">Добавить овощ</button>
                <a th:href="@{/veggies}" class="btn">Отмена</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
